<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#020202" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        var r = document.documentElement, W = innerWidth, H = innerHeight, m = W < 820;
        var w = m ? 420 : 1440, h = m ? 860 : 900, s = Math.min(W / w, H / h);
        var g = (m ? 600 : 560) + Math.max(0, H / s - h) / 2;
        if (m) r.setAttribute("data-mobile", "");
        r.style.setProperty("--s", s.toFixed(4));
        r.style.setProperty("--t", Math.min(1.6, Math.max(1, 1 / s)).toFixed(4));
        r.style.setProperty("--gap", g.toFixed(1) + "px");
        r.style.setProperty("--ngap", (g * 0.45).toFixed(1) + "px");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
